aid: civicplus
name: CivicPlus
description: >-
  CivicPlus is a govtech company providing an integrated platform for local,
  state, and education government operations, serving 13,000+ public-sector
  customers. Its product suite spans municipal websites, agenda and meeting
  management, recreation management, community development (permitting,
  licensing, code enforcement), utility billing, mass notification, public
  records requests (NextRequest), Municode codification, payments (CivicPlus
  Pay), and the SeeClickFix 311 resident-request CRM. The most developer-facing
  public interface in the CivicPlus family is the SeeClickFix API v2, a REST API
  over civic service requests (issues), comments, users, places, and questions,
  which additionally exposes an Open311 GeoReport v2 compatible endpoint for
  interoperable civic-issue reporting.
